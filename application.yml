server:
  port: 8080

lavalink:
  server:
    password: "TESTPASSWORD123"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  dependencies:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.2"
      repository: "https://maven.lavalink.dev/releases"

youtubePlugin:
  enabled: true
  allowSearch: true
  allowDirectVideoIds: true
  clients:
    - MUSIC
    - WEB
    - WEBEMBEDDED
    - TVHTML5EMBEDDED

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO